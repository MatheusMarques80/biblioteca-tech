services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_biblioteca
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - app_biblioteca_net
    depends_on:
      - db_mysql
  
  db_mysql:
    image: mysql:9.7.2
    container_name: app_biblioteca_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    networks:
      - app_biblioteca_net



  nginx:
    image: nginx
    container_name: app_biblioteca_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_biblioteca_net
    depends_on:
      - app
networks:
  app_biblioteca_net:
    driver: bridge

volumes:
  db_data:
    driver: local